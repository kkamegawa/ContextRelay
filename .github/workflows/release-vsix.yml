name: Release VSIX

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  release:
    name: Build and Release VSIX
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm

      - name: Ensure tag commit is on main branch
        shell: bash
        run: |
          git fetch origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"; then
            echo "Tag commit belongs to main history."
          else
            echo "Tag commit is not on main branch history."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Sync extension version from pushed tag
        id: version
        shell: bash
        run: node scripts/tag-version.cjs --apply --require-env --write-github-output

      - name: Verify package.json matches the tag version
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          if [ "${ACTUAL_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "package.json version (${ACTUAL_VERSION}) does not match tag version (${EXPECTED_VERSION})."
            exit 1
          fi
          echo "package.json version is ${ACTUAL_VERSION}."

      - name: Build extension package
        run: npm run package

      - name: Package VSIX
        run: npm run vsce:package

      - name: Locate VSIX artifact
        id: package
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VSIX_PATH="$(ls -1 *.vsix | head -n 1)"
          if [ -z "${VSIX_PATH}" ]; then
            echo "VSIX file was not generated."
            exit 1
          fi
          MANIFEST_VERSION="$(unzip -p "${VSIX_PATH}" extension/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "${MANIFEST_VERSION}" != "${EXPECTED_VERSION}" ]; then
            echo "VSIX manifest version (${MANIFEST_VERSION}) does not match tag version (${EXPECTED_VERSION})."
            exit 1
          fi
          echo "VSIX manifest version is ${MANIFEST_VERSION}."
          echo "vsix_path=${VSIX_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Publish VSIX to GitHub Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vsix-${{ github.ref_name }}
          path: ${{ steps.package.outputs.vsix_path }}
          if-no-files-found: error

      - name: Build release context (diff/issues since previous release)
        id: release_notes
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const currentTag = context.ref.replace('refs/tags/', '');

            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner,
              repo,
              per_page: 100,
            });

            const previousRelease = releases.find((r) => r.tag_name !== currentTag);

            let diffSection = 'No previous release found. This appears to be the first release.';
            let issueSection = '- None found';

            if (previousRelease) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${previousRelease.tag_name}...${currentTag}`,
              });

              const commits = compare.data.total_commits ?? 0;
              const changedFiles = compare.data.files?.length ?? 0;
              const compareUrl = compare.data.html_url;

              diffSection = [
                `- Previous release: \`${previousRelease.tag_name}\``,
                `- Compare: ${compareUrl}`,
                `- Commits: ${commits}`,
                `- Changed files: ${changedFiles}`,
              ].join('\n');

              const closedAfter = new Date(previousRelease.published_at ?? previousRelease.created_at).toISOString();
              const searchQuery = `repo:${owner}/${repo} is:issue is:closed closed:>${closedAfter}`;

              const issueResults = await github.paginate(
                github.rest.search.issuesAndPullRequests,
                {
                  q: searchQuery,
                  per_page: 100,
                },
              );

              const issues = issueResults
                .filter((item) => !item.pull_request)
                .slice(0, 30)
                .map((item) => `- #${item.number} ${item.title}`);

              if (issues.length > 0) {
                issueSection = issues.join('\n');
              }
            }

            const body = [
              '## Release Summary',
              '',
              '### Changes since previous release',
              diffSection,
              '',
              '### Closed issues since previous release',
              issueSection,
              '',
              '> Additional release notes below are auto-generated by GitHub.',
            ].join('\n');

            core.setOutput('body', body);

      - name: Create GitHub Release (standard style with generated notes)
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: ${{ steps.release_notes.outputs.body }}
          files: ${{ steps.package.outputs.vsix_path }}
