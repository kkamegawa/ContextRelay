name: Push Protection

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-only:
    name: Enforce owner-only changes
    runs-on: ubuntu-latest
    steps:
      - name: Validate actor
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            SUBJECT="${PR_AUTHOR}"
            MODE="pull request author"
          else
            SUBJECT="${ACTOR}"
            MODE="pusher"
          fi

          echo "Validating ${MODE}: ${SUBJECT} (allowed: ${OWNER})"

          if [ "${SUBJECT}" != "${OWNER}" ]; then
            echo "Only repository owner (${OWNER}) can push or propose changes to main/tags."
            exit 1
          fi

          echo "Validation passed."
