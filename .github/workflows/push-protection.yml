name: Push Protection
# NOTE: This workflow enforces owner-only changes to main and tags.
# To actually block non-owner pushes/PRs, configure this workflow as a
# required status check in a branch protection rule or repository ruleset
# (Settings → Branches / Rules → require "Enforce owner-only changes").

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  owner-only:
    name: Enforce owner-only changes
    runs-on: ubuntu-latest
    steps:
      - name: Validate actor
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
          DEPENDABOT: dependabot[bot]
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            SUBJECT="${PR_AUTHOR}"
            MODE="pull request author"
          else
            SUBJECT="${ACTOR}"
            MODE="pusher"
          fi

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            ALLOWED="${OWNER}, ${DEPENDABOT}"
          else
            ALLOWED="${OWNER}"
          fi

          echo "Validating ${MODE}: ${SUBJECT} (allowed: ${ALLOWED})"

          if [ "${SUBJECT}" != "${OWNER}" ]; then
            if [ "${EVENT_NAME}" != "pull_request" ] || [ "${SUBJECT}" != "${DEPENDABOT}" ]; then
              echo "Only repository owner (${OWNER}) can push to main/tags. Pull requests to main may also be authored by ${DEPENDABOT}."
              exit 1
            fi
          fi

          echo "Validation passed."
